# Despliegue
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-despacho
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-despacho
  template:
    metadata:
      labels:
        app: backend-despacho
    spec:
      containers:
        - name: backend-despacho
          # AWS_ACCOUNT_ID se sustituye via envsubst en el pipeline CI/CD
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/backend-despachos:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: DB_ENDPOINT
              value: mysql-despachos
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: innovatech_despachos
            - name: DB_USERNAME
              value: root
            - name: DB_PASSWORD
              value: root
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: backend-despacho
spec:
  selector:
    app: backend-despacho
  ports:
    - port: 8081        # ✅ corregido: el backend corre en 8081 (application.properties)
      targetPort: 8081
  type: ClusterIP
