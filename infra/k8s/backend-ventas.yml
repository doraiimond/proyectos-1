#Despliegue
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-ventas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-ventas
  template:
    metadata:
      labels:
        app: backend-ventas
    spec:
      containers:
        - name: backend-ventas
          image: 975050162000.dkr.ecr.us-east-1.amazonaws.com/backend-ventas
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_ENDPOINT
              value: mysql-ventas
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: innovatech_ventas
            - name: DB_USERNAME
              value: root
            - name: DB_PASSWORD
              value: root
---
#Service:
apiVersion: v1
kind: Service
metadata:
  name: backend-ventas
spec:
  selector:
    app: backend-ventas
  ports:
    - port: 8080
      targetPort: 8080
  type: LoadBalancer