server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/ventas {
        proxy_pass http://backend-ventas:8080;
    }

    location /api/v1/despachos {
        proxy_pass http://backend-despacho:8081;
    }
}