name: CI/CD - Innovatech

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: innovatech-eks

jobs:
  # ---------------------------------------------------------------
  # CI: se corre siempre (push y PR) - valida que todo compile/pase
  # ---------------------------------------------------------------
  ci-backend-ventas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/back-Ventas_SpringBoot/Springboot-API-REST
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & test
        run: mvn -B clean verify

  ci-backend-despachos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & test
        run: mvn -B clean verify

  ci-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/front_despacho
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/front_despacho/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_VENTAS: ""
          VITE_API_DESPACHOS: ""

  # ---------------------------------------------------------------
  # CD: solo en push a develop, y solo si el CI pasó
  # ---------------------------------------------------------------
  deploy:
    needs: [ci-backend-ventas, ci-backend-despachos, ci-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Obtener AWS Account ID
        run: |
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      # -------------------------
      # TERRAFORM
      # -------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: infra/terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan

      - name: Esperar EKS
        run: |
          aws eks wait cluster-active \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      # -------------------------
      # ECR
      # -------------------------
      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------
      # BACKEND VENTAS
      # -------------------------
      - name: Build & Push Backend Ventas
        uses: docker/build-push-action@v6
        with:
          context: ./backend/back-Ventas_SpringBoot/Springboot-API-REST
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/backend-ventas:latest
            ${{ steps.login-ecr.outputs.registry }}/backend-ventas:${{ github.sha }}

      # -------------------------
      # BACKEND DESPACHOS
      # -------------------------
      - name: Build & Push Backend Despachos
        uses: docker/build-push-action@v6
        with:
          context: ./backend/back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/backend-despachos:latest
            ${{ steps.login-ecr.outputs.registry }}/backend-despachos:${{ github.sha }}

      # -------------------------
      # FRONTEND
      # -------------------------
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/front_despacho
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/frontend-despacho:latest
            ${{ steps.login-ecr.outputs.registry }}/frontend-despacho:${{ github.sha }}

      # -------------------------
      # KUBERNETES
      # -------------------------
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Verificar conexión EKS
        run: kubectl get nodes

      - name: Aplicar Secrets de DB
        run: |
          kubectl create secret generic db-credentials \
            --from-literal=DB_USERNAME=root \
            --from-literal=DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifiestos MySQL
        run: |
          kubectl apply -f infra/k8s/mysql-despacho.yml
          kubectl apply -f infra/k8s/mysql-ventas.yml

      - name: Aplicar manifiestos (con AWS_ACCOUNT_ID sustituido)
        run: |
          envsubst < infra/k8s/backend-despacho.yml | kubectl apply -f -
          envsubst < infra/k8s/backend-ventas.yml   | kubectl apply -f -
          envsubst < infra/k8s/frontend.yml         | kubectl apply -f -

      - name: Set image (fuerza pull de :sha, no depende solo de :latest)
        run: |
          kubectl set image deployment/backend-ventas backend-ventas=${{ steps.login-ecr.outputs.registry }}/backend-ventas:${{ github.sha }}
          kubectl set image deployment/backend-despacho backend-despacho=${{ steps.login-ecr.outputs.registry }}/backend-despachos:${{ github.sha }}
          kubectl set image deployment/frontend frontend=${{ steps.login-ecr.outputs.registry }}/frontend-despacho:${{ github.sha }}

      - name: Esperar Backend Ventas
        run: kubectl rollout status deployment/backend-ventas --timeout=300s

      - name: Esperar Backend Despacho
        run: kubectl rollout status deployment/backend-despacho --timeout=300s

      - name: Esperar Frontend
        run: kubectl rollout status deployment/frontend --timeout=300s
